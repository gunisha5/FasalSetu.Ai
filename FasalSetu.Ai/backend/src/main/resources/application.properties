# Application properties
spring.application.name=backend
server.port=8080

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/fasalsetu_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Mail (Gmail SMTP configuration)
# IMPORTANT: Replace YOUR_GMAIL and YOUR_APP_PASSWORD with actual credentials internally.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# JWT Configuration
# In production, securely provide this via ENV var (must be at least 256-bit safe byte array)
jwt.secret=FasalSetuSuperSecretKeyWithVeryLongLengthRequiredForHS256ToFunctionProperly1234!!
jwt.expiration.ms=86400000
